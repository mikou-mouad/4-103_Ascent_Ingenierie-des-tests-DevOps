<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embarq – Iroise Traversées</title>
  <link rel="stylesheet" href="/embarq.css">
</head>
<body>
<header>
  <a href="/" class="marque">Iroise Traversées</a>
  <span class="slogan">Brest · Le Conquet · Molène · Ouessant</span>
</header>

<main>
  <h1>Prochaines traversées</h1>

  <p th:if="${traversees.isEmpty()}" class="vide">Aucune traversée programmée.</p>

  <section class="cartes" th:unless="${traversees.isEmpty()}">
    <article class="carte" data-testid="traversee" th:each="d : ${traversees}">
      <p class="carte-date" th:text="${#temporals.format(d.traversee().dateHeure, 'EEEE d MMMM, HH:mm')}">lundi 1 avril, 08:30</p>
      <h2 class="carte-trajet" th:text="|${d.traversee().depart} → ${d.traversee().arrivee}|">Brest → Ouessant</h2>
      <p class="carte-navire" data-testid="navire" th:text="${d.traversee().navire}">Fromveur II</p>
      <p class="carte-places" th:text="${d.complete()} ? 'Complet' : |${d.placesRestantes()} places|">280 places</p>
      <a th:unless="${d.complete()}" class="bouton" data-testid="reserver"
         th:href="@{/traversees/{id}/reservation(id=${d.traversee().id})}">Réserver ma place</a>
    </article>
  </section>
</main>

<footer class="pied" th:text="|Embarq ${version} · ${environnement}|">Embarq dev · local</footer>
</body>
</html>
