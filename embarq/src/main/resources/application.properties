spring.application.name=embarq

# Base de données : surchargée par les variables d'environnement SPRING_DATASOURCE_* en préprod et en prod
spring.datasource.url=jdbc:postgresql://localhost:5432/embarq
spring.datasource.username=embarq
spring.datasource.password=embarq
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Affichage en français (dates, montants)
spring.web.locale=fr_FR
spring.web.locale-resolver=fixed

# Version et environnement affichés en bas des pages et dans /actuator/info.
# La version est le tag de l'image Docker (EMBARQ_VERSION), sinon la version du pom.
embarq.version=${EMBARQ_VERSION:@project.version@}
embarq.environnement=${ENVIRONNEMENT:local}

# Santé et version, pour les smoke tests après un déploiement
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.version=${embarq.version}
info.environnement=${embarq.environnement}
